name: Build & push action image

# Publish the action's Docker image to GHCR on every version tag, and move the
# floating major tag (v1) so `uses: itzmekhokan/pressready@v1` always resolves to
# the latest v1.x release.
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write   # move the floating v<major> git tag
  packages: write   # push to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/itzmekhokan/pressready
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # QEMU lets the amd64 runner emulate arm64 so we publish one multi-arch
      # manifest — pullable on GitHub-hosted (amd64) and Apple Silicon / arm64
      # self-hosted runners alike.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Move floating major git tag (v1)
        run: |
          set -euo pipefail
          MAJOR="${GITHUB_REF_NAME%%.*}"   # v1.3.0 -> v1
          git tag -f "$MAJOR"
          git push origin -f "refs/tags/$MAJOR"

  # Build the single-file distributable and attach it to the GitHub release, so
  # consumers can `curl -L .../pressready.phar` with no composer install and no
  # chance of clashing with their pinned phpcs.
  release-phar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: phar.readonly=0

      # Install with dev deps so the phar bundles the pre-release WP compat engine
      # (PHP 8.2–8.4 detection), mirroring the action image.
      - name: Install toolchain
        run: composer install --no-interaction --no-progress

      - name: Build pressready.phar
        run: php bin/build-phar.php build/pressready.phar

      - name: Smoke-test the phar
        run: php build/pressready.phar --php=8.4 --wp=6.9 --path=tests/fixtures/upgrade.php --no-default-ignore --format=summary

      - name: Attach phar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/pressready.phar --clobber
