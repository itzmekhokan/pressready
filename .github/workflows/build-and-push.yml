name: Build & push action image

# Publish the action's Docker image to GHCR on every version tag, and move the
# floating major tag (v1) so `uses: itzmekhokan/pressready@v1` always resolves to
# the latest v1.x release.
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write   # move the floating v<major> git tag
  packages: write   # push to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/itzmekhokan/pressready
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Move floating major git tag (v1)
        run: |
          set -euo pipefail
          MAJOR="${GITHUB_REF_NAME%%.*}"   # v1.3.0 -> v1
          git tag -f "$MAJOR"
          git push origin -f "refs/tags/$MAJOR"
