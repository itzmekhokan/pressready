name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Deny-by-default token; each job grants only what it needs.
permissions: {}

# A newer push to the same PR supersedes the running build; pushes to main
# always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-all

      # Installs exactly what composer.lock pins, so CI tests the same toolchain
      # the phar and the Docker image ship.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit dependencies for known vulnerabilities
        run: composer audit --locked

      - name: Lint PHP sources
        run: |
          php -l bin/pressready
          php -l bin/gen-wp-deprecations.php
          php -l Pressready/Sniffs/WordPress/DeprecatedSniff.php
          php -l Pressready/CLI/Command.php
          php -l wp-cli.php

      - name: Confirm the Pressready standard is registered
        run: vendor/bin/phpcs -i | grep -q Pressready

      - name: Smoke tests
        run: php tests/smoke.php

      - name: Dogfood — self-scan for PHP ${{ matrix.php }} fatals
        run: php bin/pressready --php=${{ matrix.php }} --path=Pressready --fail-on=fatal
