name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-all

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP sources
        run: |
          php -l bin/pressready
          php -l bin/gen-wp-deprecations.php
          php -l Pressready/Sniffs/WordPress/DeprecatedSniff.php
          php -l Pressready/CLI/Command.php
          php -l wp-cli.php

      - name: Confirm the Pressready standard is registered
        run: vendor/bin/phpcs -i | grep -q Pressready

      - name: Smoke tests
        run: php tests/smoke.php

      - name: Dogfood — self-scan for PHP ${{ matrix.php }} fatals
        run: php bin/pressready --php=${{ matrix.php }} --path=Pressready --fail-on=fatal
